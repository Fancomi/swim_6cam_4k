<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>物体打点标注器</title>
<style>
  html,body{height:100%;margin:0;background:#12161d;color:#e6ebf2;font:12px/1.5 system-ui,monospace}
  body{display:flex}
  #side{width:230px;background:#171b23;border-right:1px solid #2a3140;display:flex;flex-direction:column;gap:8px;padding:10px;overflow-y:auto}
  h2{font-size:14px;color:#5cd0ff;margin:0}
  h3{font-size:11px;color:#8aa;margin:0 0 3px;text-transform:uppercase;letter-spacing:.5px}
  .card{border-top:1px solid #262d3a;padding-top:8px;display:flex;flex-direction:column;gap:5px}
  button{padding:6px 8px;background:#232a35;border:1px solid #39424f;color:#e6ebf2;border-radius:5px;cursor:pointer;font:inherit}
  button:hover{background:#2e3644}
  button.primary{background:#1f6f43;border-color:#2e9e60}
  .hint{color:#9fb0c3;background:#1b2029;padding:6px 8px;border-radius:5px;font-size:11px}
  kbd{display:inline-block;min-width:12px;padding:0 4px;border:1px solid #4a5566;border-radius:3px;background:#20262f;color:#a9b7c6;font-size:10px}
  #stage{position:relative;flex:1;background:#0c0f14;overflow:hidden;min-width:0}
  canvas{position:absolute;inset:0;cursor:crosshair}
  #status{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);padding:4px 9px;border-radius:4px;color:#ffd479}
  #hud{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.55);padding:5px 9px;border-radius:4px;white-space:pre}
  #plist{display:flex;flex-direction:column;gap:2px;max-height:38vh;overflow-y:auto}
  #plist .row{display:flex;justify-content:space-between;gap:4px;padding:3px 6px;border:1px solid #2a3140;border-radius:4px;cursor:pointer}
  #plist .row.on{background:#0e5aa7;border-color:#3aa0ff}
  #plist .row .x{color:#f88;padding:0 4px}
  .dot{width:8px;height:8px;border-radius:50%;background:#ffd479;display:inline-block;margin-left:6px;visibility:hidden}
  .dot.on{visibility:visible}
</style>
</head>
<body>
<div id="side">
  <h2>物体打点标注器</h2>
  <button id="open" class="primary">📂 选择根目录</button>
  <div class="hint">选目录后递归载入全部图像。切图不需保存，标注常驻内存。<br>Chrome / Edge 可原地写回目录。</div>
  <div class="card">
    <h3>图像 <span class="dot" id="dirty"></span></h3>
    <div style="display:flex;gap:5px"><button id="prev" style="flex:1">◀ 上一张</button><button id="next" style="flex:1">下一张 ▶</button></div>
    <div id="fname" class="hint" style="word-break:break-all">—</div>
  </div>
  <div class="card">
    <h3>保存</h3>
    <button id="save1">💾 原地保存（逐图 json）<kbd>1</kbd></button>
    <button id="save2" class="primary">🗂 单文件工程 json<kbd>2</kbd></button>
  </div>
  <div class="card">
    <h3>点 <span id="pcount">0</span></h3>
    <div id="plist"></div>
    <button id="clear">清空本图的点</button>
  </div>
  <div class="card hint">
    <b>鼠标</b> 左键空白=加点 · 拖点=移动 · 右键点=删<br>
    <b>键盘</b> <kbd>←</kbd><kbd>→</kbd>切图 · <kbd>Tab</kbd>选点 · <kbd>Del</kbd>删点<br>
    <kbd>Enter</kbd>在光标处加点 · <kbd>Shift</kbd>+方向 微调选中点<br>
    <kbd>Space</kbd>拖拽=平移 · 滚轮=缩放 · <kbd>F</kbd>复位视图
  </div>
</div>
<div id="stage">
  <canvas id="cv"></canvas>
  <div id="hud"></div>
  <div id="status">未加载</div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
